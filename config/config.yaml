# Search Automation Config
# Edit domain list, engine ratio, dan settings sesuai kebutuhan

domains:
  - bagasunix.com

engine_ratio:
  google: 70
  bing: 30

scheduler:
  max_search_per_proxy: 5          # 5 searches per proxy per day
  new_article_boost: 5             # first week: 5 searches
  regular_max: 3                   # after boost: 3 searches max
  captcha_pause_hours: 3           # auto pause when CAPTCHA spike
  min_cooldown_seconds: 5          # testing: diperkecil
  max_cooldown_seconds: 15         # testing: diperkecil
  post_exit_cooldown_min: 5        # testing: diperkecil
  post_exit_cooldown_max: 15       # testing: diperkecil
  active_hours_start: 0            # testing: semua jam aktif
  active_hours_end: 24             # testing: semua jam aktif
  # --- Bandwidth controls (balance: hemat tapi tetap human-like) ---
  pre_search_enabled: true         # false = skip pre-search entirely (hemat ~1 MB/task)
  pre_search_2_chance: 0.25        # 25% chance second pre-search (cukup variasi, gak boros)
  serp_casual_click_chance: 0.15   # 15% klik random result di SERP (kadang browsing)
  competitor_click_chance: 0.10    # 10% klik competitor dulu (kadang compare)
  distraction_exit_chance: 0.05    # 5% exit ke distraction site (kadang terdistraksi)
  serp_dwell_seconds_min: 2        # min time reading SERP snippets before clicking
  serp_dwell_seconds_max: 5        # max time reading SERP snippets

proxy:
  refresh_interval_hours: 3
  health_check_timeout: 8
  # Legacy single key (backward compat) — akan diabaikan jika webshare_api_keys diisi
  webshare_api_key: ""
  # Multi-key rotation: key #0 dipakai dulu sampai semua proxy-nya habis/CAPTCHA,
  # baru pindah ke key #1, dst.
  webshare_api_keys:
    - "4o2y8qp2pijurc2gefxjnsyff53ljmhqnsa6zjg6"  # key #0 (bandwidth exhausted)
    - "h5v1f7iv613kg03wvtlbd4os97bnk1b72y983lrj"  # key #1 (active)
    # - "YOUR_THIRD_API_KEY_HERE"                   # key #2
  sources: []
  # sources (disabled — hanya pakai Webshare API):
    # GitHub raw lists
    # - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt
    # - https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt
    # - https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt
    # - https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies-http.txt
    # - https://raw.githubusercontent.com/roosterkid/openproxylist/main/HTTPS_RAW.txt
    # API endpoints
    # - https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=protocolipport&format=text&protocol=http
    # - https://proxylist.geonode.com/api/proxy-list?limit=500&page=1&sort_by=lastChecked&sort_type=desc
    # HTML pages
    # - https://free-proxy-list.net/
    # - https://spys.one/en/http-proxy-list/

grpc:
  port: 50051
  worker_timeout: 600

captcha:
  enabled: true                # attempt audio reCAPTCHA solving
  max_attempts: 3              # retry count per CAPTCHA encounter
  solver: "whisper"            # "google_web" (free, rate-limited) | "whisper" (local, accurate) | "google_cloud" (API key)
  whisper_model: "large-v3"    # tiny|base|small|medium|large-v3 (only for solver: "whisper")

bandwidth:
  monthly_limit_mb: 1024      # Webshare free plan = 1GB per key per month
  # URL-aware blocking: target domains (see: domains:) get full resources for realism.
  # Non-target sites (Google, Bing, competitors, distractions) get aggressive blocking.
  block_images: false          # target: keep images | non-target: always block images
  block_media: true            # block video/audio/media everywhere
  block_fonts: true            # block font files everywhere
  block_stylesheets: false     # target: keep CSS | non-target: block CSS
  warn_threshold_percent: 80   # log warning when bandwidth usage hits this %
  pause_threshold_percent: 95  # pause this API key when usage hits this %

article_collection:
  method: sitemap
  refresh_interval_hours: 6
