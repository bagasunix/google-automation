# Search Automation Config
# Edit domain list, engine ratio, dan settings sesuai kebutuhan

auth:
  enabled: true
  # username/password live in .env only (DASHBOARD_USERNAME / DASHBOARD_PASSWORD)
  # — never put real credentials here, this file is tracked by git.

domains:
  - bagasunix.com

engine_ratio:
  google: 70
  bing: 10
  direct: 10
  social: 10

scheduler:
  concurrency: 4                   # concurrent worker slots — Go orchestrator AND
                                    # Python worker's thread pool both read this,
                                    # so raising it here scales both sides together.
                                    # Bounded by available RAM: each slot = 1 full
                                    # Chrome instance. Tune down if the host swaps.
  max_search_per_proxy: 5          # testing: 5 search per proxy (was 1 — 12 active proxies × 1 = only 12/day, already hit)
  new_article_boost: 5             # first week: 5 searches
  regular_max: 3                   # after boost: 3 searches max
  captcha_pause_hours: 3           # auto pause when CAPTCHA spike
  min_cooldown_seconds: 5          # testing: diperkecil
  max_cooldown_seconds: 15         # testing: diperkecil
  post_exit_cooldown_min: 5        # testing: diperkecil
  post_exit_cooldown_max: 15       # testing: diperkecil
  active_hours_start: 0            # testing: semua jam aktif
  active_hours_end: 24             # testing: semua jam aktif
  # --- Bandwidth controls (balance: hemat tapi tetap human-like) ---
  pre_search_enabled: true         # false = skip pre-search entirely (hemat ~1 MB/task)
  pre_search_2_chance: 0.25        # 25% chance second pre-search (cukup variasi, gak boros)
  serp_casual_click_chance: 0.15   # 15% klik random result di SERP (kadang browsing)
  competitor_click_chance: 0.10    # 10% klik competitor dulu (kadang compare)
  distraction_exit_chance: 0.05    # 5% exit ke distraction site (kadang terdistraksi)
  serp_dwell_seconds_min: 2        # min time reading SERP snippets before clicking
  serp_dwell_seconds_max: 5        # max time reading SERP snippets
  max_searches_per_domain_per_day: 0  # 0 = unlimited; set e.g. 50 untuk multi-domain

proxy:
  refresh_interval_hours: 3
  health_check_timeout: 8
  # Keys live in .env only (WEBSHARE_API_KEYS, comma-separated) — never put
  # real keys here, this file is tracked by git. These stay empty; .env
  # always overrides them anyway (see applyEnvOverrides in config.go), but
  # leaving real values here too was exactly the kind of two-sources-of-
  # truth drift that's easy to lose track of when rotating a key.
  webshare_api_key: ""
  webshare_api_keys: []
  sources: []
  # sources (disabled — hanya pakai Webshare API):
    # GitHub raw lists
    # - https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master/http.txt
    # - https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/http.txt
    # - https://raw.githubusercontent.com/clarketm/proxy-list/master/proxy-list-raw.txt
    # - https://raw.githubusercontent.com/jetkai/proxy-list/main/online-proxies/txt/proxies-http.txt
    # - https://raw.githubusercontent.com/roosterkid/openproxylist/main/HTTPS_RAW.txt
    # API endpoints
    # - https://api.proxyscrape.com/v4/free-proxy-list/get?request=display_proxies&proxy_format=protocolipport&format=text&protocol=http
    # - https://proxylist.geonode.com/api/proxy-list?limit=500&page=1&sort_by=lastChecked&sort_type=desc
    # HTML pages
    # - https://free-proxy-list.net/
    # - https://spys.one/en/http-proxy-list/

grpc:
  port: 50051
  worker_timeout: 600

captcha:
  enabled: true                # attempt audio reCAPTCHA solving
  max_attempts: 3              # retry count per CAPTCHA encounter
  solver: "openai_api"         # "openai_api" (Groq/OpenAI) | "google_web" | "whisper" (local)
  whisper_model: "base"        # "base" (~70MB, cepat) | "small" (~140MB)
  # --- openai_api backend (OpenAI, Groq, atau provider lain yang OpenAI-compatible) ---
  openai_api_key: ""           # keep empty — set OPENAI_API_KEY or GROQ_API_KEY in .env
  openai_base_url: "https://api.groq.com/openai/v1"  # kosongkan untuk OpenAI default
  openai_model: "whisper-large-v3-turbo"             # model STT di provider tersebut
  # --- token injection solver untuk Google /sorry/ reCAPTCHA v2 ---
  token_solver: "capsolver"    # "capsolver" | "2captcha"
  token_solver_key: ""         # keep empty — set TOKEN_SOLVER_KEY in .env

bandwidth:
  monthly_limit_mb: 1024      # Webshare free plan = 1GB per key per month
  # URL-aware blocking: target domains (see: domains:) get full resources for realism.
  # Non-target sites (Google, Bing, competitors, distractions) get aggressive blocking.
  block_images: false          # target: keep images | non-target: always block images
  block_media: true            # block video/audio/media everywhere
  block_fonts: true            # block font files everywhere
  block_stylesheets: false     # target: keep CSS | non-target: block CSS
  warn_threshold_percent: 80   # log warning when bandwidth usage hits this %
  pause_threshold_percent: 95  # pause this API key when usage hits this %

article_collection:
  method: sitemap
  refresh_interval_hours: 6
  max_concurrent_fetches: 4        # was hardcoded to 20 — that many simultaneous
                                    # requests to your own domain reads as a burst
                                    # attack to most rate-limiters/WAFs and was
                                    # causing HTTP 503s on nearly every refresh

telegram:
  enabled: false
  bot_token: ""   # isi dengan token dari @BotFather
  chat_id: ""     # isi dengan chat_id kamu (cek via @userinfobot)

gsc:
  # Path ke CSV export dari Google Search Console (Performance report ->
  # export -> CSV, pastikan kolomnya include Query/Page/Clicks/Impressions/
  # CTR/Position). Artikel yang cocok dengan halaman di CSV ini dapat bobot
  # ekstra saat dipilih untuk di-search — makin tinggi impression tapi CTR
  # rendah di posisi 4-20, makin sering diprioritaskan (lihat internal/gsc).
  # Kosongkan buat matiin fitur ini — pemilihan artikel balik ke bobot
  # posisi SERP biasa.
  csv_path: ""    # contoh: data/gsc_export.csv
  weight_multiplier: 10   # seberapa kuat halaman opportunity tertinggi di-boost
                           # relatif ke bobot tier posisi SERP biasa (default 10x =
                           # halaman opportunity terbaik dapet sampai 11x bobot
                           # tier-nya). Naikkan kalau masih jarang kepilih di pool
                           # artikel yang banyak, turunkan kalau terlalu dominan.
