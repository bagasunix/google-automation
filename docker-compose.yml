services:
  # Python worker — browser automation with playwright
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: ga-worker
    restart: unless-stopped
    ports:
      - "50051:50051"
    volumes:
      - screenshots:/app/screenshots
      - results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; grpc.insecure_channel('localhost:50051')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ga-net

  # Go orchestrator — proxy manager + scheduler + analytics
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ga-orchestrator
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    environment:
      - DB_PATH=/app/data/search_automation.db
    volumes:
      - db-data:/app/data
      - ./config/config.yaml:/app/config/config.yaml:ro
    command:
      - "--config"
      - "config/config.yaml"
      - "--db"
      - "/app/data/search_automation.db"
      - "--worker-host"
      - "worker"
    networks:
      - ga-net

volumes:
  db-data:
  screenshots:
  results:

networks:
  ga-net:
    driver: bridge
