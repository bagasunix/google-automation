syntax = "proto3";
package searchautomation;

option go_package = "google-automation/internal/grpc/proto";

service WorkerService {
    rpc ExecuteTask (TaskRequest) returns (TaskResponse);
}

message TaskRequest {
    string task_id = 1;
    string article_title = 2;
    string article_url = 3;
    string domain = 4;
    string proxy_ip = 5;
    int32 proxy_port = 6;
    string engine = 7;                  // "google" | "bing"
    repeated string pre_search_queries = 8;
    string proxy_username = 9;          // auth for Webshare proxies
    string proxy_password = 10;         // auth for Webshare proxies
    string proxy_country = 11;          // proxy geo country (e.g. "GB", "US") for timezone/locale matching
    string proxy_timezone = 12;         // IANA timezone (e.g. "Europe/London") derived from proxy country
    // Bandwidth-saving behavior controls (from scheduler config)
    bool pre_search_enabled = 13;       // false = skip pre-search entirely
    double pre_search_2_chance = 14;    // 0.0-1.0 probability of second pre-search
    double serp_casual_click_chance = 15; // 0.0-1.0 probability of clicking random SERP result during browse
    double competitor_click_chance = 16;  // 0.0-1.0 probability of clicking competitor before target
    double distraction_exit_chance = 17;  // 0.0-1.0 probability of navigating to distraction site on exit
    int32 serp_dwell_seconds_min = 18;   // min seconds reading SERP snippets
    int32 serp_dwell_seconds_max = 19;   // max seconds reading SERP snippets
}

message TaskResponse {
    string task_id = 1;
    bool success = 2;
    string engine = 3;
    string proxy_used = 4;
    int32 serp_position = 5;            // 0 = not found
    int32 dwell_time_seconds = 6;
    int32 scroll_depth_percent = 7;
    int32 internal_clicks = 8;
    bool captcha_hit = 9;
    string error = 10;
    int32 bandwidth_used_kb = 11;      // actual bytes transferred through proxy
}
